<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Pray - 당신을 위한 기도</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment: #fcfaf2;
            --divine-gold: #c5a059;
            --deep-charcoal: #1c1c1e;
            --soft-gray: #f5f5f7;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--parchment);
            color: var(--deep-charcoal);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        h1, h2, .serif {
            font-family: 'Bodoni Moda', serif;
        }
        .glass-header {
            background: rgba(252, 250, 242, 0.8);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .chat-container {
            height: calc(100vh - 220px);
            scrollbar-width: none;
            padding-bottom: 100px;
        }
        .chat-container::-webkit-scrollbar { display: none; }
        
        .message-ai {
            background: white;
            border: 1px solid rgba(197, 160, 89, 0.15);
            border-radius: 20px 20px 20px 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            animation: fadeUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .message-user {
            background: var(--deep-charcoal);
            color: white;
            border-radius: 20px 20px 4px 20px;
            animation: fadeUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-area {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.1);
        }
        .gold-btn {
            background: var(--divine-gold);
            color: white;
            border-radius: 25px;
            transition: all 0.3s ease;
        }
        .gold-btn:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }
        .gold-btn:active { transform: scale(0.98); }
        
        .welcome-card {
            background: linear-gradient(135deg, #fff 0%, #f9f6ef 100%);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .voice-pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(197, 160, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0); }
        }
    </style>
</head>
<body class="flex justify-center min-h-screen">
    <div class="w-full max-w-2xl flex flex-col px-4 md:px-0">
        <header class="glass-header py-5 flex justify-between items-center px-4 mb-2">
            <div class="flex items-center gap-3">
                <span class="text-2xl text-[var(--divine-gold)]">🕊️</span>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-[var(--deep-charcoal)]">My Pray</h1>
                    <p class="text-[10px] uppercase tracking-[0.1em] text-[var(--divine-gold)] font-semibold">Divine Wisdom for You</p>
                </div>
            </div>
            <div id="status-indicator" class="flex items-center gap-2 px-3 py-1 bg-green-50 rounded-full">
                <div class="w-1.5 h-1.5 bg-green-500 rounded-full"></div>
                <span class="text-[10px] font-medium text-green-600">연결됨</span>
            </div>
        </header>

        <main class="flex-1 flex flex-col">
            <div id="chat-box" class="chat-container overflow-y-auto space-y-8 py-6">
                <!-- Welcome Card -->
                <div class="welcome-card text-center">
                    <h2 class="serif text-2xl mb-3 text-[var(--divine-gold)]">오늘의 묵상</h2>
                    <p class="text-sm italic text-gray-600 leading-relaxed mb-4">
                        "너희는 마음에 근심하지 말라 하나님을 믿으니 또 나를 믿으라" <br>
                        <span class="font-semibold not-italic">— 요한복음 14:1</span>
                    </p>
                    <div class="h-px bg-gradient-to-r from-transparent via-[var(--divine-gold)] to-transparent opacity-20 my-4"></div>
                    <p class="text-[13px] text-gray-500">평안하십니까. 무엇이든 편안하게 말씀해 주세요.</p>
                </div>

                <!-- Initial AI Message -->
                <div class="flex justify-start gap-3 items-end">
                    <div class="w-9 h-9 rounded-full bg-[var(--divine-gold)] flex items-center justify-center text-white text-xs shadow-md">진리</div>
                    <div class="message-ai p-5 max-w-[85%] text-[15px] leading-relaxed">
                        성도님, 오늘 하루도 주님의 은혜 아래 평안하셨는지요. 
                        마음속에 무거운 짐이 있다면 이 자리에 내려놓으셔도 좋습니다. 
                        함께 기도하는 마음으로 귀를 기울이겠습니다.
                    </div>
                </div>
            </div>

            <!-- Bottom Input Section -->
            <div class="sticky bottom-0 pb-8 pt-4 bg-gradient-to-t from-[var(--parchment)] via-[var(--parchment)] to-transparent">
                <div class="input-area flex items-center p-2 gap-2">
                    <button id="mic-btn" onclick="startRecognition()" class="p-3 rounded-full hover:bg-gray-100 transition-all group" title="음성 입력">
                        <svg class="w-5 h-5 text-gray-400 group-hover:text-[var(--divine-gold)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-20a3 3 0 00-3 3v8a3 3 0 006 0V5a3 3 0 00-3-3z"></path>
                        </svg>
                    </button>
                    <input type="text" id="user-input" placeholder="상담 신청하기..." 
                           class="flex-1 bg-transparent border-none focus:ring-0 text-[15px] px-2 outline-none">
                    <button onclick="sendMessage()" class="gold-btn px-6 py-2.5 font-semibold text-[14px]">
                        대화하기
                    </button>
                </div>
                <p class="text-[10px] text-center text-gray-400 mt-4 tracking-wider uppercase opacity-60">
                    &copy; 2026 My Pray &middot; Divine Wisdom
                </p>
            </div>
        </main>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const micBtn = document.getElementById('mic-btn');
        let history = [];

        // TTS Setup
        const synth = window.speechSynthesis;
        function speak(text) {
            if (synth.speaking) synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            const voices = synth.getVoices();
            const maleVoice = voices.find(v => v.lang === 'ko-KR' && (v.name.includes('Male') || v.name.includes('Daeho') || v.name.includes('Kisu'))) || 
                              voices.find(v => v.lang === 'ko-KR');
            utter.voice = maleVoice;
            utter.pitch = 0.85; 
            utter.rate = 0.9;
            synth.speak(utter);
        }

        // STT Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                sendMessage();
            };
            recognition.onend = () => {
                micBtn.classList.remove('voice-pulse', 'bg-red-50');
                micBtn.querySelector('svg').classList.remove('text-red-500');
            };
        }

        function startRecognition() {
            if (!recognition) return alert('브라우저가 음성 인식을 지원하지 않습니다.');
            recognition.start();
            micBtn.classList.add('voice-pulse', 'bg-red-50');
            micBtn.querySelector('svg').classList.add('text-red-500');
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, history })
                });

                const data = await response.json();
                if (data.response) {
                    appendMessage('ai', data.response);
                    speak(data.response);
                    history.push({ role: 'user', parts: [{ text: message }] });
                    history.push({ role: 'model', parts: [{ text: data.response }] });
                } else {
                    const errMsg = '성도님, 잠시 연결이 고르지 못하네요. 다시 말씀해 주시겠어요?';
                    appendMessage('ai', errMsg);
                    speak(errMsg);
                }
            } catch (error) {
                const errMsg = '오류가 발생했습니다. 평안을 위해 기도하겠습니다.';
                appendMessage('ai', errMsg);
                speak(errMsg);
            }
        }

        function appendMessage(role, text) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} gap-3 items-end`;
            
            if (role === 'ai') {
                const avatar = document.createElement('div');
                avatar.className = "w-9 h-9 rounded-full bg-[var(--divine-gold)] flex items-center justify-center text-white text-xs shadow-md";
                avatar.innerText = "진리";
                wrapper.appendChild(avatar);
            }

            const bubble = document.createElement('div');
            bubble.className = `${role === 'user' ? 'message-user' : 'message-ai'} p-5 max-w-[85%] text-[15px] leading-relaxed shadow-sm whitespace-pre-wrap`;
            bubble.innerText = text;
            wrapper.appendChild(bubble);

            chatBox.appendChild(wrapper);
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    </script>
</body>
</html>
